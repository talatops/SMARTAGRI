<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="smart_agri_system">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>smart_agri_system</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @font-face {
      font-family: 'InterSplash';
      src: url('assets/assets/fonts/inter/inter.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'InterSplash';
      src: url('assets/assets/fonts/inter/inter_bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #060D1A;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #060D1A 0%, #0A1424 100%);
      font-family: 'InterSplash', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                   Roboto, Helvetica, Arial, sans-serif;
      opacity: 1;
      transition: opacity 450ms ease;
    }

    #splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
    }

    .splash-brand {
      display: block;
      width: 340px;
      max-width: 85vw;
      height: auto;
      margin-bottom: 24px;
    }

    .splash-logo-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
    }

    .splash-logo {
      width: 40px;
      height: 40px;
      color: #2ECC71;
      filter: drop-shadow(0 0 14px rgba(46, 204, 113, 0.45));
    }

    .splash-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.06);
      border-top-color: #1FA2FF;
      border-right-color: #2ECC71;
      animation: splash-spin 1.1s linear infinite;
    }

    .splash-title {
      margin: 0;
      font-size: clamp(19px, 5vw, 25px);
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #FFFFFF;
      line-height: 1.25;
    }

    .splash-title span {
      color: #2ECC71;
    }

    .splash-tagline {
      margin: 10px 0 0;
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 400;
      color: #93A5BC;
      line-height: 1.5;
    }

    .splash-bar {
      position: relative;
      width: min(200px, 60vw);
      height: 3px;
      margin-top: 30px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .splash-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #1FA2FF 0%, #29B6F6 50%, #2ECC71 100%);
      animation: splash-slide 1.5s ease-in-out infinite;
    }

    .splash-status {
      margin: 14px 0 0;
      font-size: 11.5px;
      color: #5E7490;
      letter-spacing: 0.2px;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes splash-slide {
      0%   { left: -40%; }
      100% { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-ring,
      .splash-bar-fill {
        animation: none;
      }
      .splash-bar-fill {
        left: 0;
        width: 100%;
        opacity: 0.6;
      }
      #splash {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <img class="splash-brand" src="assets/assets/irada_logo.svg"
           alt="IRADA - Indigenous Research and Development Agency">

      <div class="splash-logo-wrap">
        <div class="splash-ring"></div>
        <svg class="splash-logo" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>

      <h1 class="splash-title">Smart Agriculture <span>System</span></h1>
      <p class="splash-tagline">Smarter Water &middot; Healthier Crops &middot; Higher Yields</p>

      <div class="splash-bar" role="progressbar" aria-label="Loading">
        <div class="splash-bar-fill"></div>
      </div>
      <p class="splash-status">Loading dashboard&hellip;</p>
    </div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;

      var dismissed = false;

      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        splash.classList.add('splash-hidden');
        window.setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 500);
      }

      window.addEventListener('flutter-first-frame', dismiss);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
