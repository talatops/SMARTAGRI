name: smart_agri_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.3
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0
  firebase_auth_web: ^6.3.0
#  firebase_auth: ^6.7.0
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  dio: ^5.11.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    - assets/irada_logo.png
    - assets/icons/
    - assets/icons/weather/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/inter.ttf
          weight: 400
        - asset: assets/fonts/inter/inter_medium.ttf
          weight: 500
        - asset: assets/fonts/inter/inter_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/inter/inter_bold.ttf
          weight: 700
